<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spire Zero preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kreon:wght@400;500;700&display=block">
<style>
  /* The Workshop preview, 1024 x 1024 (preview.png, under Steam's 1 MB): the docs' stone wall, gold and Kreon
     (docs/src/styles/spire.css), no game art. README.md says how it is rendered. */
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #0c1318; }
  body { font-family: 'Kreon', serif; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="wall" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#22323d"/>
      <stop offset="0.55" stop-color="#162129"/>
      <stop offset="1" stop-color="#0a1015"/>
    </radialGradient>
    <!-- stone courses: offset bricks, faint -->
    <pattern id="bricks" width="128" height="64" patternUnits="userSpaceOnUse">
      <path d="M0 0.5H128M0 32.5H128M0.5 0V32M64.5 32V64" stroke="#2a3a45" stroke-width="2" fill="none" opacity="0.55"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#f0c75e"/>
      <stop offset="1" stop-color="#b8892c"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34485a"/>
      <stop offset="0.5" stop-color="#4a6275"/>
      <stop offset="1" stop-color="#26364a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0c75e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f0c75e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#wall)"/>
  <rect width="1024" height="1024" fill="url(#bricks)"/>
  <rect width="1024" height="1024" fill="url(#wall)" opacity="0.35"/>

  <!-- light behind the zero -->
  <circle cx="512" cy="160" r="230" fill="url(#halo)"/>

  <!-- the spire: floors from a wide base up to a point -->
  <g>
    <polygon points="512,120 600,640 424,640" fill="url(#stone)"/>
    <polygon points="512,120 600,640 512,640" fill="url(#shade)"/>
    <!-- floor lines -->
    <g stroke="#162129" stroke-width="5">
      <line x1="482" y1="300" x2="542" y2="300"/>
      <line x1="473" y1="350" x2="551" y2="350"/>
      <line x1="465" y1="400" x2="559" y2="400"/>
      <line x1="456" y1="450" x2="568" y2="450"/>
      <line x1="448" y1="500" x2="576" y2="500"/>
      <line x1="439" y1="550" x2="585" y2="550"/>
    </g>
    <!-- lit windows, climbing -->
    <g fill="#f0c75e">
      <rect x="494" y="315" width="12" height="20" rx="6"/>
      <rect x="518" y="315" width="12" height="20" rx="6"/>
      <rect x="505" y="365" width="14" height="20" rx="7"/>
      <rect x="480" y="415" width="12" height="20" rx="6" opacity="0.35"/>
      <rect x="532" y="415" width="12" height="20" rx="6"/>
      <rect x="505" y="465" width="14" height="20" rx="7" opacity="0.35"/>
      <rect x="470" y="515" width="12" height="20" rx="6"/>
      <rect x="542" y="515" width="12" height="20" rx="6" opacity="0.35"/>
      <rect x="497" y="580" width="30" height="60" rx="15" fill="#0c1318"/>
    </g>
    <!-- the base it stands on -->
    <rect x="380" y="636" width="264" height="18" rx="4" fill="#2a3a45"/>
    <rect x="352" y="652" width="320" height="14" rx="4" fill="#1e2c36"/>
  </g>

  <!-- the zero: a gold ring around the spire's tip -->
  <ellipse cx="512" cy="160" rx="88" ry="106" fill="none" stroke="url(#gold)" stroke-width="22" filter="url(#glow)"/>
  <ellipse cx="512" cy="160" rx="88" ry="106" fill="none" stroke="#fff3c4" stroke-width="3" opacity="0.6"/>

  <!-- title -->
  <text x="512" y="800" text-anchor="middle" font-family="Kreon" font-weight="700" font-size="132" letter-spacing="10"
        fill="#05080b" opacity="0.7" transform="translate(0,6)">SPIRE ZERO</text>
  <text x="512" y="800" text-anchor="middle" font-family="Kreon" font-weight="700" font-size="132" letter-spacing="10"
        fill="url(#gold)">SPIRE ZERO</text>
  <rect x="312" y="836" width="400" height="3" fill="#8a6f2e"/>
  <text x="512" y="900" text-anchor="middle" font-family="Kreon" font-weight="500" font-size="38" fill="#ece5d3">an AI that learned Slay the Spire 2 from zero</text>
  <text x="512" y="962" text-anchor="middle" font-family="Kreon" font-weight="500" font-size="24" letter-spacing="6" fill="#98a4a8">ADVICE · AUTO-PLAY · OPEN SOURCE</text>
</svg>
</body>
</html>
