[package]
name = "sts2_batch"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py312"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
