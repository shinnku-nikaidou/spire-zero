# What port does with each class of the game. See DESIGN.md, "The translation".
# Names are the game's own: namespaces and full type names in [scope] and [drop], Class or Class.Member elsewhere.

[game]
# The version the tables below are for: gen.sh reads the decompiled source of this version, the schema carries it.
version = "v0.113.1"
# The version whose code the hand-stated facts below (a fixed value, a member written by hand, [only], a cache, ...)
# were last read against. On a new version port compares the code each rests on and lists those whose code changed
# for a person to read again (report.txt; DESIGN.md, "When the game changes"); once they are read, this is the new one.
facts = "v0.113.1"

[scope]
# Translated: every class of these namespaces (the namespace itself, not the ones below it), and the types named in full.
translate = [
    # the content
    "MegaCrit.Sts2.Core.Models.Cards",
    "MegaCrit.Sts2.Core.Models.Powers",
    "MegaCrit.Sts2.Core.Models.Relics",
    "MegaCrit.Sts2.Core.Models.Monsters",
    "MegaCrit.Sts2.Core.Models.Potions",
    "MegaCrit.Sts2.Core.Models.Orbs",
    "MegaCrit.Sts2.Core.Models.Enchantments",
    "MegaCrit.Sts2.Core.Models.Afflictions",
    "MegaCrit.Sts2.Core.Models.Encounters",
    # the core the content stands on
    "MegaCrit.Sts2.Core.Models.AbstractModel",
    "MegaCrit.Sts2.Core.Models.CardModel",
    "MegaCrit.Sts2.Core.Models.PowerModel",
    "MegaCrit.Sts2.Core.Models.RelicModel",
    "MegaCrit.Sts2.Core.Models.MonsterModel",
    "MegaCrit.Sts2.Core.Models.PotionModel",
    "MegaCrit.Sts2.Core.Models.OrbModel",
    "MegaCrit.Sts2.Core.Models.EnchantmentModel",
    "MegaCrit.Sts2.Core.Models.AfflictionModel",
    "MegaCrit.Sts2.Core.Models.EncounterModel",
    "MegaCrit.Sts2.Core.Models.ModelId",
    "MegaCrit.Sts2.Core.Models.ITemporaryPower",
    "MegaCrit.Sts2.Core.Commands",
    "MegaCrit.Sts2.Core.Commands.Builders",
    "MegaCrit.Sts2.Core.Hooks",
    "MegaCrit.Sts2.Core.Combat",
    "MegaCrit.Sts2.Core.Combat.History",
    "MegaCrit.Sts2.Core.Combat.History.Entries",
    "MegaCrit.Sts2.Core.Entities.Cards",
    "MegaCrit.Sts2.Core.Entities.Creatures",
    "MegaCrit.Sts2.Core.Entities.Players",
    "MegaCrit.Sts2.Core.Entities.Powers",
    "MegaCrit.Sts2.Core.Entities.Orbs",
    "MegaCrit.Sts2.Core.Entities.Potions",
    "MegaCrit.Sts2.Core.Entities.Relics",
    "MegaCrit.Sts2.Core.Entities.Intents",
    "MegaCrit.Sts2.Core.Entities.FoolArrows",
    "MegaCrit.Sts2.Core.Entities.Enchantments",
    "MegaCrit.Sts2.Core.Entities.Models",
    "MegaCrit.Sts2.Core.MonsterMoves",
    "MegaCrit.Sts2.Core.MonsterMoves.Intents",
    "MegaCrit.Sts2.Core.MonsterMoves.MonsterMoveStateMachine",
    "MegaCrit.Sts2.Core.Localization.DynamicVars",
    # a text's place in the tables (its table and its key): what a card prompt is named by
    "MegaCrit.Sts2.Core.Localization.LocString",
    "MegaCrit.Sts2.Core.ValueProps",
    "MegaCrit.Sts2.Core.Extensions",
    "MegaCrit.Sts2.Core.Factories",
    "MegaCrit.Sts2.Core.GameActions",
    "MegaCrit.Sts2.Core.GameActions.Multiplayer",
    "MegaCrit.Sts2.Core.Entities.Multiplayer.NetCombatCard",
    "MegaCrit.Sts2.Core.CardSelection",
    "MegaCrit.Sts2.Core.Helpers.AscensionHelper",
    "MegaCrit.Sts2.Core.Helpers.MathHelper",
    "MegaCrit.Sts2.Core.Helpers.NonInteractiveMode",
    "MegaCrit.Sts2.Core.Helpers.TaskHelper",
    # what a combat reads of the run around it
    "MegaCrit.Sts2.Core.Random",
    "MegaCrit.Sts2.Core.Odds",
    # the run's dominion (Dread): a model that takes the combat's hooks
    "MegaCrit.Sts2.Core.Models.Dread",
    "MegaCrit.Sts2.Core.Models.Dread.Dominions",
    # a model by its id, for what holds cards in their saved form
    "MegaCrit.Sts2.Core.Saves.SaveUtil",
    # who answers a card prompt (written by hand: [manual])
    "MegaCrit.Sts2.Core.TestSupport.ICardSelector",
    # what is unlocked decides which cards a pool can give
    "MegaCrit.Sts2.Core.Timeline.EpochModel",
    "MegaCrit.Sts2.Core.Timeline.Epochs",
    "MegaCrit.Sts2.Core.Runs.RunState",
    "MegaCrit.Sts2.Core.Runs.History",
    "MegaCrit.Sts2.Core.Runs.PlayerMapPointHistoryEntry",
    "MegaCrit.Sts2.Core.Map.MapPointType",
    "MegaCrit.Sts2.Core.Map.MapCoord",
    "MegaCrit.Sts2.Core.Saves.Runs.SerializableCard",
    "MegaCrit.Sts2.Core.Saves.Runs.SerializableEnchantment",
    "MegaCrit.Sts2.Core.Saves.Runs.SavedProperties",
    "MegaCrit.Sts2.Core.Runs.IRunState",
    "MegaCrit.Sts2.Core.Runs.NullRunState",
    "MegaCrit.Sts2.Core.Runs.ICardScope",
    "MegaCrit.Sts2.Core.Runs.IPlayerCollection",
    "MegaCrit.Sts2.Core.Runs.RunRngSet",
    "MegaCrit.Sts2.Core.Runs.RelicGrabBag",
    "MegaCrit.Sts2.Core.Runs.ExtraRunFields",
    "MegaCrit.Sts2.Core.Runs.RunManager",
    "MegaCrit.Sts2.Core.Entities.Ascension",
    "MegaCrit.Sts2.Core.Unlocks.UnlockState",
    "MegaCrit.Sts2.Core.Context.LocalContext",
    "MegaCrit.Sts2.Core.Rooms.AbstractRoom",
    "MegaCrit.Sts2.Core.Rooms.CombatRoom",
    # the room below the combat's when an event starts the combat
    "MegaCrit.Sts2.Core.Rooms.EventRoom",
    "MegaCrit.Sts2.Core.Models.ModelDb",
    "MegaCrit.Sts2.Core.Models.CharacterModel",
    "MegaCrit.Sts2.Core.Models.Characters",
    "MegaCrit.Sts2.Core.Models.CardPoolModel",
    "MegaCrit.Sts2.Core.Models.CardPools",
    "MegaCrit.Sts2.Core.Models.RelicPoolModel",
    "MegaCrit.Sts2.Core.Models.RelicPools",
    "MegaCrit.Sts2.Core.Models.PotionPoolModel",
    "MegaCrit.Sts2.Core.Models.PotionPools",
    "MegaCrit.Sts2.Core.Models.RunModel",
    "MegaCrit.Sts2.Core.Models.MultiplayerScalingModel",
    "MegaCrit.Sts2.Core.Models.BadgeModel",
    "MegaCrit.Sts2.Core.Models.Badges",
    "MegaCrit.Sts2.Core.Models.ModifierModel",
    "MegaCrit.Sts2.Core.Models.Modifiers",
    # what a combat hands to the run: the rewards it adds
    "MegaCrit.Sts2.Core.Rewards",
    "MegaCrit.Sts2.Core.Runs.CardCreationOptions",
]
exclude = []

[drop]
# Presentation: the namespace and everything below it.
namespaces = [
    "Godot",
    "MegaCrit.Sts2.Core.Nodes",
    "MegaCrit.Sts2.Core.Audio",
    "MegaCrit.Sts2.Core.HoverTips",
    "MegaCrit.Sts2.Core.Animation",
    "MegaCrit.Sts2.Core.Assets",
    "MegaCrit.Sts2.Core.Bindings",
    "MegaCrit.Sts2.Core.Localization",
    "MegaCrit.Sts2.Core.Achievements",
    "MegaCrit.Sts2.Core.Platform",
    "MegaCrit.Sts2.Core.Debug",
    "MegaCrit.Sts2.Core.TestSupport",
    "MegaCrit.Sts2.Core.Logging",
    "MegaCrit.Sts2.Core.ControllerInput",
    "MegaCrit.Sts2.Core.DevConsole",
    "MegaCrit.Sts2.addons",
    # the run's map: nothing of a combat
    "MegaCrit.Sts2.Core.Map",
]
# Kept although a namespace above them is dropped.
keep = ["MegaCrit.Sts2.Core.Localization.DynamicVars"]
types = [
    # the save files and the profile's progress: what a combat does to them is outside the combat
    "MegaCrit.Sts2.Core.Saves.SaveManager",
    "MegaCrit.Sts2.Core.Commands.SfxCmd",
    "MegaCrit.Sts2.Core.Commands.VfxCmd",
    "MegaCrit.Sts2.Core.Commands.TalkCmd",
    "MegaCrit.Sts2.Core.Commands.ThinkCmd",
    # the wire forms of the actions (multiplayer)
    "MegaCrit.Sts2.Core.GameActions.Net*",
    "MegaCrit.Sts2.Core.GameActions.INetAction",
    # tells the screen that something of the combat changed: it subscribes to every creature, pile and card
    "MegaCrit.Sts2.Core.Combat.CombatStateTracker",
    # the combat's background scenes, which the screen picks with its own rng (EncounterModel._backgroundAssets): null
    # in the simulator, set in the game once the room is drawn
    "MegaCrit.Sts2.Core.Rooms.BackgroundAssets",
    # the rewards the players of one game see of each other; it listens for the combat's end
    "MegaCrit.Sts2.Core.Multiplayer.Game.RewardSynchronizer",
    "System.Text.StringBuilder",
    "System.Console",
    "System.Diagnostics.Debug",
    "System.Diagnostics.Stopwatch",
    "System.GC",
    "System.IDisposable",
    # waiting: the engine runs straight through
    "System.Threading.CancellationToken",
    "System.Threading.CancellationTokenSource",
    "System.Threading.Lock",
    "System.Threading.Lock.Scope",
    "System.Threading.Tasks.TaskCompletionSource",
    "System.Threading.Tasks.TaskCompletionSource`1",
]
members = [
    "Cmd.Wait",
    "Cmd.CustomScaledWait",
    "CreatureCmd.TriggerAnim",
    "CardCmd.Preview",
    "CardCmd.PreviewCardPileAdd",
    # the generator for things that do not matter (screen shake angles): different on every run by design
    "Rng.Chaotic",
    # the checksums players of one game compare, the replay file
    "RunManager.ChecksumTracker",
    "RunManager.WriteReplay",
    # the words a text var puts into a description (a title, a player's name)
    "StringVar.StringValue",
    # the run's clock
    "RunManager.WinTime",
    "RunManager.RunTime",
    # a text's words, and what is put into them: only its place in the tables is kept (keep_members)
    "LocString.*",
    "DynamicVarSet.AddTo",
]
keep_members = ["LocString..ctor", "LocString.LocTable", "LocString.LocEntryKey"]

# Parameters that only carry presentation: the argument is left out with them. (A formatted text for a tooltip.)
parameters = ["StringVar..ctor.baseValue"]
# Instance fields that are not state, as Class.Field (the property's name for the field behind one, the event's name
# for an event that would be state: DESIGN.md, "Events").
fields = [
    # the network
    "ActionQueueSynchronizer._netService",
    "ActionQueueSynchronizer._messageBuffer",
    "PlayerChoiceSynchronizer._netService",
    "RewardsSet._synchronizer",
    # who answers a player's card prompts: the simulator's selector there, the engine's own here
    "CardSelectorStack._localSelector",
    "CardSelectorStack._selectorStacks",
    # a card's title, looked up once
    "CardModel._titleLocString",
    "StringVar.StringValue",
    # a chosen event option in the run's history: its title's words, a LocString's variables copied (presentation)
    "EventOptionHistoryEntry.Variables",
    # Events whose subscribers are the action queue, the executor and the turn loop waiting on each other: the
    # hand-written core runs them in turn and does itself what these announce ([manual]).
    "ActionQueueSet.ActionQueueChanged",
    "GameAction.AfterFinished",
    "CombatState.CreaturesChanged",
]

[fields]
# Classes of which only the named fields are state. The rest of them is the run outside the combat, the network, the
# bookkeeping of what the engine writes by hand.
LocString = ["locTable", "locEntryKey"]
RunManager = ["State", "AscensionManager", "ActionQueueSet", "ActionExecutor", "ActionQueueSynchronizer", "PlayerChoiceSynchronizer", "CardSelectorStack"]
RunState = ["_players", "_currentActIndex", "_currentRooms", "_allCards", "_mapPointHistory", "_visitedMapCoords", "Dominion", "GameMode", "AscensionLevel", "Rng", "Odds", "UnlockState", "Modifiers", "BadgeModels", "RunModels", "ExtraFields", "SharedRelicGrabBag"]
# The room of an event that started the combat: the event itself is not a combat's.
EventRoom = ["_isPreFinished"]

[delegates]
# A delegate is a value (DESIGN.md, "Delegates"): a function of the engine's table and the object it is bound to. The
# schema has the fields that hold one (kind `delegate`) and the classes of what lambdas capture; an export carries them.
# Fields whose delegate is never run after a decision: kept in the engine, not part of an export.
# AttackCommand: both are read only inside Execute, which has ended before any decision (a power may still hold the
# finished command, for its plain fields).
transient = ["AttackCommand._afterAttackerAnim", "AttackCommand._beforeDamage"]

[memo]
# Walks that build a list of the combat's objects and then hand on each one that passes a test (DESIGN.md, "Kept
# walks"): the list, and each test's answer once asked, are kept while nothing they read is written, and used by the
# next walk. What they read port finds in their code, at any depth of call: objects only (a static of [roots] stops
# the translation). A write between two items sends the rest of that walk to the test as the game asks it. Every hook
# walks these, most of them more than once.
walks = ["CombatState.IterateHookListeners", "RunState.IterateHookListeners"]
# Getters of an object, kept for each object while nothing they read is written, as the walks: a card's pile is
# asked several times by every getter of the card that looks at its combat.
getters = ["CardModel.Pile"]

[only]
# A hook loop whose call does nothing for the kinds that do not override the member it calls is told the kinds that
# do (DESIGN.md, "What a hook does nothing for"). Two facts of the game's own classes let the loop's other statements
# go with the call for those kinds:
# - pairs (Class.Open/Close): Close right after Open, handed the same value, leaves the object as anything reads it.
#   PlayerChoiceContext's model stack: the value pushed is popped (a stack made empty on the way is read as none:
#   only ModelStack tells them apart, and nothing calls it).
# - scratch (Class): an object made in the loop for one listener's call alone, by being made and by its own members
#   handed a task run to its end, changes nothing outside itself: HookPlayerChoiceContext's fields, its owner looked
#   up, its own model stack; its waits (manual/hook_player_choice_context.rs) give back what the task gave.
pairs = ["PlayerChoiceContext.PushModel/PopModel"]
scratch = ["HookPlayerChoiceContext"]

[caches]
# Statics that only remember the result of a computation: never kept, computed at each use.
members = [
    "ModelDb._allCards", "ModelDb._allCardPools", "ModelDb._allCharacterCardPools", "ModelDb._allSharedEvents",
    "ModelDb._allEvents", "ModelDb._allEncounters", "ModelDb._eventEncounters", "ModelDb._allPotions",
    "ModelDb._allPotionPools", "ModelDb._allCharacterPotionPools", "ModelDb._allCharacterRelicPools",
    "ModelDb._allSharedPotionPools", "ModelDb._allPowers", "ModelDb._allRelics", "ModelDb._acts",
    "ModelDb._actsByIndex", "ModelDb._badges", "ModelDb._achievements",
    # flags that an error was reported once
    "CombatManager._staleTurnEndReported", "CombatManager._turnLoopWaitTimeoutReported",
]

[manual]
# The one who answers a card prompt (manual/i_card_selector.rs): the game asks whoever is on its selector stack.
# What mods add (manual/mod_helper.rs): nothing, there are none.
classes = ["ICardSelector", "ModHelper"]
# The canonical models are built by manual/canon.rs: what the game's ModelDb does by reflection.
members = [
    # What a model saves, read and written over port's table of its [SavedProperty] properties (manual/saved_properties.rs).
    "SavedProperties.FromInternal",
    "SavedProperties.FillInternal",
    # A model by its class or id: the game looks in tables it fills by reflection, the engine in the arenas of
    # canonical models (manual/model_db.rs, manual/canon.rs).
    "ModelDb.Get", "ModelDb.GetId", "ModelDb.GetByIdOrNull", "ModelDb.Contains",
    # Who answers a player's card prompts: the engine's one selector answers where the game's screen does (the local
    # selector), and the stack holds only the game's own selector while Whispering Earring plays cards.
    "CardSelectorStack.GetSelector", "CardSelectorStack.PushSelector", "CardSelectorStack.LocalSelector",
    # The id of an epoch class, which the game keeps in a table filled by reflection (manual/epoch_model.rs).
    "EpochModel.GetId",
    # The turn loop and the action queue wait on each other in the game; here they run in turn (manual/, world.rs).
    "CombatManager.StartCombatInternal", "CombatManager.SetReadyToEndTurn", "CombatManager.SetReadyToBeginEnemyTurn",
    "CombatManager.WaitUntilQueueIsEmptyOrWaitingOnNonPlayerDrivenAction", "CombatManager.DoTurnEndCards",
    # A player's setup that pauses for a choice lets the rest of the turn start run first (manual/combat_manager.rs).
    "CombatManager.StartTurn",
    "ActionExecutor.ExecuteActions", "ActionExecutor.FinishedExecutingActions", "ActionExecutor.IsRunning",
    "GameAction.Execute", "GameAction.WaitForActionToResumeExecutingAfterPlayerChoice",
    "ActionQueueSynchronizer.RequestEnqueue", "ActionQueueSynchronizer.RequestResumeActionAfterPlayerChoice",
    "ActionQueueSet.BecameEmpty",
    "BranchingPlayerChoiceContext.AssignTaskAndWaitForPauseOrCompletion",
    "HookPlayerChoiceContext.AssignTaskAndWaitForPauseOrCompletion",
    "HookPlayerChoiceContext.WaitForPauseOrCompletionWithoutAssigningTask", "HookPlayerChoiceContext.WaitForCompletion",
    "HookPlayerChoiceContext.SignalPlayerChoiceBegun", "HookPlayerChoiceContext.SignalPlayerChoiceEnded",
    # A hook that asks the player waits, and its rest runs as this action (manual/hook_player_choice_context.rs).
    "GenericHookGameAction.ExecuteAction",
    "GameActionPlayerChoiceContext.SignalPlayerChoiceBegun", "GameActionPlayerChoiceContext.SignalPlayerChoiceEnded",
    # waits for a creature another player's game has yet to make
    "CombatState.GetCreatureAsync",
    # The shipped game damages each enemy as the boulder reaches it, one hit per enemy in list order; test mode deals
    # one hit to all of them, whose hooks run after every enemy has lost its HP. The simulator the engine is held
    # against keeps the shipped rule (its RuleFidelity), which is drawn on the screen and not code port can read
    # (manual/rolling_boulder_power.rs).
    "RollingBoulderPower.DoDamage",
]

[open]
# Base classes that own no arena: their fields are part of every class directly below them.
classes = ["AbstractModel"]

[roots]
# Statics of the game that are state. In the engine they are part of the combat; an export starts from them.
members = [
    "CombatManager.Instance",
    "RunManager.Instance",
    "NetCombatCardDb.Instance",
    "NullRunState.Instance",
    "LocalContext.NetId",
    "CombatTurnState._sequenceCounter",
]

[statics]
# Statics whose initializer reads more than constants (.NET runs it once a process, the engine at every read) and
# gives the same value whenever it is read: canonical models of the model table, which never change in a process;
# text keys and paths of presentation. A static that reads a run's or a combat's state (the ascension level, ..) is
# not translated: its value is the first run's of the process. Port lists every one with what it reads.
fixed = [
    # canonical models and their ids
    "BowlbugsNormal._workerValidCounts", "Cauldron._testPotions", "CultistsNormal._cultists", "Fabricator.aggroSpawns",
    "Fabricator.defenseSpawns", "FlyconidNormal._mediumSlimes", "KnowledgeDemon._curseOfKnowledgeSets", "OrbModel._validOrbs",
    "RubyRaidersNormal._raiderValidCounts", "SlimesWeak._mediumSlimes", "SlimesWeak._smallSlimes",
    "SlitheringStranglerNormal._mediumSlimes", "SlitheringStranglerNormal._smallSlimes",
    # text keys, scene paths, animation data
    "CalcifiedCultist._cawCawDialogue", "CardKeywordExtensions._period", "DampCultist._cawCawDialogue",
    "DecimillipedeSegment.rocksVfxPath", "DevotedSculptor._forbiddenIncantationDialogue", "IntentAnimData._data",
    "KinPriest._followersDeathLine", "KinPriest._ritualApplyLine", "KnowledgeDemon._curseOfKnowledgeDoneLine",
    "KnowledgeDemon._curseOfKnowledgeStartLine", "MagiKnight._dampenDialogue", "MonsterModel._fallbackVisualsPath",
]

[strings]
# Members whose strings, compared by the current culture (EndsWith, StartsWith of a string), are names of ASCII
# letters, digits and underscores: there culture and ordinal agree, and the engine compares them ordinal. A model's
# category is made of its class's name; a seed is upper-case letters and digits.
ordinal = ["ModelId..ctor", "ModelId.SlugifyCategory", "RunRngSet..ctor"]

[enter]
# Members that tell hand-written code that they run: `m::<class>::enter(name, arguments.., c)` before the member's
# body, `m::<class>::leave(c)` after it.
# - A card prompt is named by the entry that asks it and by that entry's arguments (manual/card_select_cmd.rs); the
#   bundle screen is no card prompt.
# - Whispering Earring plays cards with a selector of the game's own on the stack (manual/whispering_earring.rs).
members = ["CardSelectCmd.From*", "WhisperingEarring.AfterAutoPrePlayPhaseEnteredLate"]
except = ["CardSelectCmd.FromChooseABundleScreen"]

[enter.arguments]
# What `enter` gets of the member's parameters, picked by type or by name; null or None where a member has none.
CardSelectCmd = ["type:CardPile", "name:source", "type:PlayerChoiceContext", "type:CardSelectorPrefs", "type:EnchantmentModel", "name:amount", "name:canSkip"]

[values]
# Classes held by value in Rust (a struct, compared by content): immutable records.
classes = ["ModelId", "LocString"]

[value]
# Members with a fixed value in the engine. The real game the engine is checked against runs headless with TestMode on.
"TestMode.IsOn" = "true"
"TestMode.IsOff" = "false"
# The tests' hook that hands out a chosen relic: there is none.
"TestRngInjector.ConsumeRelicOverride" = "Obj::NULL"
# Nor one that hands out a chosen rarity.
"TestRngInjector.GetRelicRarityOverride" = "None"
# Nothing cancels a combat of the engine.
# The simulator the engine is held against keeps the shipped rule where test mode skips a draw (its RuleFidelity).
"TestMode.IsOn@Cauldron.GenerateRewards" = "false"
"TestMode.IsOn@CallingBell.GenerateRewards" = "false"
# Fur Coat asks whether the room the party stands in is one it marked, through the map's point at the current
# coordinate (at the combat's start and when an enemy joins). The map is not held; the point at a coordinate has that
# coordinate.
"MapPoint.coord@FurCoat.AfterCreatureAddedToCombat" = "g::dispatch::i_run_state::current_map_coord(g::entities_players::player::run_state(g::models::relic_model::owner(me, c), c), c).unwrap()"
"MapPoint.coord@FurCoat.BeforeCombatStart" = "g::dispatch::i_run_state::current_map_coord(g::entities_players::player::run_state(g::models::relic_model::owner(me, c), c), c).unwrap()"
# An action of the engine has no task that could have failed: a failure is a panic.
"GameAction.Exception" = "Exception::default()"
# One player, no network.
"RunManager.NetService" = "Obj::NULL"
"RunManager.IsCleaningUp" = "false"
"INetGameService.Type" = "NetGameType::Singleplayer"
"INetGameService.NetId" = "c.s.local_context__net_id.unwrap()"
# The game the engine is held against runs with no mod.
"ModHelper.IterateAllCombatStateSubscribers" = "Vec::<Obj>::new()"
"ModHelper.IterateAllRunStateSubscribers" = "Vec::<Obj>::new()"
# the speed setting only times waits and animations
"PrefsSave.FastMode" = "FastModeType::Instant"
# every text the game asks for is in its tables
"LocString.Exists" = "true"
# A delegate of the engine has no object behind it to ask for (the game asks only to refuse one that has).
"Delegate.Target" = "Obj::NULL"
"CancellationToken.IsCancellationRequested" = "false"
"CancellationTokenSource.IsCancellationRequested" = "false"
