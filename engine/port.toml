exclude = []

[drop]
# Presentation: the namespace and everything below it.
namespaces = [
    "Godot",
    "MegaCrit.Sts2.Core.Nodes",
    "MegaCrit.Sts2.Core.Audio",
    "MegaCrit.Sts2.Core.HoverTips",
    "MegaCrit.Sts2.Core.Animation",
    "MegaCrit.Sts2.Core.Assets",
    "MegaCrit.Sts2.Core.Bindings",
    "MegaCrit.Sts2.Core.Localization",
    "MegaCrit.Sts2.Core.Achievements",
    "MegaCrit.Sts2.Core.Platform",
    "MegaCrit.Sts2.Core.Debug",
    "MegaCrit.Sts2.Core.TestSupport",
    "MegaCrit.Sts2.Core.Logging",
    "MegaCrit.Sts2.Core.ControllerInput",
    "MegaCrit.Sts2.Core.DevConsole",
    "MegaCrit.Sts2.addons",
]
# Kept although a namespace above them is dropped.
keep = ["MegaCrit.Sts2.Core.Localization.DynamicVars"]
types = [
    "MegaCrit.Sts2.Core.Commands.SfxCmd",
    "MegaCrit.Sts2.Core.Commands.VfxCmd",
    "MegaCrit.Sts2.Core.Commands.TalkCmd",
    "MegaCrit.Sts2.Core.Commands.ThinkCmd",
    # the wire forms of the actions (multiplayer)
    "MegaCrit.Sts2.Core.GameActions.Net*",
    "MegaCrit.Sts2.Core.GameActions.INetAction",
    "System.Text.StringBuilder",
    "System.Console",
    "System.Diagnostics.Debug",
    "System.Diagnostics.Stopwatch",
    "System.GC",
    "System.IDisposable",
    # waiting: the engine runs straight through
    "System.Threading.CancellationToken",
    "System.Threading.CancellationTokenSource",
    "System.Threading.Lock",
    "System.Threading.Lock.Scope",
    "System.Threading.Tasks.TaskCompletionSource",
    "System.Threading.Tasks.TaskCompletionSource`1",
]
members = [
    "Cmd.Wait",
    "Cmd.CustomScaledWait",
    "CreatureCmd.TriggerAnim",
    "CardCmd.Preview",
    "CardCmd.PreviewCardPileAdd",
    # the generator for things that do not matter (screen shake angles): different on every run by design
    "Rng.Chaotic",
]

# Instance fields that are not state, as Class.Field (the property's name for the field behind one).
fields = [
    # the network
    "ActionQueueSynchronizer._netService",
    "ActionQueueSynchronizer._messageBuffer",
    "PlayerChoiceSynchronizer._netService",
    "RewardsSet._synchronizer",
]

[fields]
# Classes of which only the named fields are state. The rest of them is the run outside the combat, the network, the
# bookkeeping of what the engine writes by hand.
RunManager = ["State", "AscensionManager", "ActionQueueSet", "ActionExecutor", "ActionQueueSynchronizer", "PlayerChoiceSynchronizer", "CardSelectorStack"]
RunState = ["_players", "_currentActIndex", "_currentRooms", "_allCards", "GameMode", "AscensionLevel", "Rng", "Odds", "UnlockState", "Modifiers", "BadgeModels", "RunModels", "ExtraFields"]

[caches]
# Statics that only remember the result of a computation: never kept, computed at each use.
members = [
    "ModelDb._allCards", "ModelDb._allCardPools", "ModelDb._allCharacterCardPools", "ModelDb._allSharedEvents",
    "ModelDb._allEvents", "ModelDb._allEncounters", "ModelDb._eventEncounters", "ModelDb._allPotions",
    "ModelDb._allPotionPools", "ModelDb._allCharacterPotionPools", "ModelDb._allCharacterRelicPools",
    "ModelDb._allSharedPotionPools", "ModelDb._allPowers", "ModelDb._allRelics", "ModelDb._acts",
    "ModelDb._actsByIndex", "ModelDb._badges", "ModelDb._achievements",
]

[manual]
classes = []
# The canonical models are built by manual/canon.rs: what the game's ModelDb does by reflection.
members = ["ModelDb.Get", "ModelDb.GetId", "ModelDb.GetByIdOrNull", "ModelDb.Contains"]

[open]
# Base classes that own no arena: their fields are part of every class directly below them.
classes = ["AbstractModel"]

[roots]
# Statics of the game that are state. In the engine they are part of the combat; an export starts from them.
members = [
    "CombatManager.Instance",
    "RunManager.Instance",
    "NetCombatCardDb.Instance",
    "LocalContext.NetId",
]

[values]
# Classes held by value in Rust (a struct, compared by content): immutable records.
classes = ["ModelId"]

[value]
# Members with a fixed value in the engine. The real game the engine is checked against runs headless with TestMode on.
"TestMode.IsOn" = "true"
"TestMode.IsOff" = "false"
# Nothing cancels a combat of the engine.
# The game the engine is held against runs with no mod.
"ModHelper.IterateAllCombatStateSubscribers" = "Vec::<Obj>::new()"
# A delegate of the engine has no object behind it to ask for (the game asks only to refuse one that has).
"Delegate.Target" = "Obj::NULL"
"CancellationToken.IsCancellationRequested" = "false"
"CancellationTokenSource.IsCancellationRequested" = "false"
