[package]
name = "sts2ai-engine"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Slay the Spire 2's combat, translated from the game's own code, for the SL planner's search"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a double read from JSON is the double that was written (the search reads C#'s lines and values).
serde_json = { version = "1", features = ["float_roundtrip"] }
# The combat net's inference in the search (plans/2026-11-18-2132-sl-search-rust.md, N2): ONNX Runtime loaded at run
# time from the library the C# side ships (Microsoft.ML.OnnxRuntime 1.31), nothing downloaded at build time.
# The engine's allocator: a search step makes about 1,400 small allocations, and mimalloc takes 13 % off the medium
# search's CPU against the system's (2026-11-19, the user's go-ahead). Everything the engine allocates is freed by the
# engine (`sz_buf_free`, the handles' frees), so the C# side never frees across allocators.
mimalloc = { version = "=0.1.50", default-features = false }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }

[features]
# The speed test counts allocations with an allocator of its own, over mimalloc: the engine then sets none.
count-alloc = []

[[test]]
name = "speed"
required-features = ["count-alloc"]
