[workspace]
resolver = "3"
members = ["crates/sts2ai-engine"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "MIT"

# The game's integer arithmetic wraps on overflow (C# unchecked): no overflow checks in any profile.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
overflow-checks = false

[profile.test]
overflow-checks = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
overflow-checks = false
